<media-container class="media-skin media-container media-video pl" data-theme="scaffold" data-preset="video">
<div class="pl-plate">
<div class="pl-head">
<span class="pl-tag"><span aria-hidden="true"><media-text token="pl.plate">Plate</media-text> <span class="pl-plate-number"></span> <span class="pl-dot">&middot;</span> </span><media-title class="pl-media-title"></media-title></span>
<span class="pl-status" aria-hidden="true"><media-text token="pl.status">Status</media-text> <span class="pl-status-word"></span></span>
</div>
<div class="pl-body">
<div class="pl-stage">
<!-- Add a compatible media component here. -->
<media-poster class="media-poster pl-poster">
<img alt="" decoding="async" class="media-poster-image">
</media-poster>
<span class="pl-mark pl-mark-tl" aria-hidden="true"></span>
<span class="pl-mark pl-mark-tr" aria-hidden="true"></span>
<span class="pl-mark pl-mark-bl" aria-hidden="true"></span>
<span class="pl-mark pl-mark-br" aria-hidden="true"></span>
<media-buffering-indicator class="pl-buffering">
<span class="pl-spinner" aria-hidden="true"></span>
</media-buffering-indicator>
<div aria-hidden="true" class="pl-indicators">
<media-volume-indicator class="pl-indicator pl-volume-indicator">
<media-volume-indicator-fill class="pl-volume-indicator-fill">
<media-text class="pl-indicator-label" token="pl.vol">Vol</media-text>
<media-volume-indicator-value class="pl-indicator-value">
</media-volume-indicator-value>
</media-volume-indicator-fill>
</media-volume-indicator>
<media-seek-indicator class="pl-indicator pl-seek-indicator">
<media-seek-indicator-value class="pl-indicator-value">
</media-seek-indicator-value>
</media-seek-indicator>
<media-status-indicator actions="toggleSubtitles,toggleFullscreen,togglePictureInPicture" class="pl-indicator pl-status-indicator">
<media-status-indicator-value class="pl-indicator-value">
</media-status-indicator-value>
</media-status-indicator>
</div>
</div>
<nav class="pl-index">
<media-text class="pl-label pl-index-label" token="pl.index">Index</media-text>
<button type="button" class="pl-btn pl-index-close"><span aria-hidden="true">&times;</span><media-text class="pl-visually-hidden" token="pl.close">Close</media-text></button>
<pl-chapters class="pl-chapters"></pl-chapters>
</nav>
</div>
<div class="pl-ruler">
<media-time-slider class="pl-time-slider" thumb-alignment="edge">
<pl-ruler-marks class="pl-ruler-marks" aria-hidden="true"></pl-ruler-marks>
<media-time-slider-chapters class="pl-time-slider-chapters">
<template>
<div class="pl-time-slider-chapter">
<media-slider-track class="pl-time-slider-track">
<media-slider-buffer class="pl-time-slider-buffer">
</media-slider-buffer>
<media-slider-fill class="pl-time-slider-fill">
</media-slider-fill>
</media-slider-track>
</div>
</template>
</media-time-slider-chapters>
<media-slider-thumb class="pl-time-slider-thumb">
</media-slider-thumb>
<media-slider-preview class="pl-time-slider-preview">
<span class="pl-detail-frame">
<media-slider-thumbnail class="pl-slider-thumbnail">
<img alt="" aria-hidden="true" decoding="async" class="pl-slider-thumbnail-image">
</media-slider-thumbnail>
</span>
<div class="pl-time-slider-preview-label">
<media-slider-value class="pl-time-slider-value" type="pointer">
</media-slider-value>
<media-time-slider-chapter-title class="pl-time-slider-chapter-title">
</media-time-slider-chapter-title>
</div>
</media-slider-preview>
</media-time-slider>
</div>
<div class="pl-foot">
<media-time-group class="pl-time">
<media-time class="pl-time-current" type="current" toggle>
</media-time>
<media-time-separator class="pl-time-sep">/</media-time-separator>
<media-time class="pl-time-duration" type="duration">
</media-time>
</media-time-group>
<media-tooltip-group class="pl-controls">
<media-play-button class="pl-btn pl-btn-play">
<span class="pl-btn-glyph" aria-hidden="true">
<media-icon family="pl" name="play" class="pl-icon pl-play-play"></media-icon>
<media-icon family="pl" name="pause" class="pl-icon pl-play-pause"></media-icon>
<media-icon family="pl" name="restart" class="pl-icon pl-play-restart"></media-icon>
</span>
<span class="pl-btn-text" aria-hidden="true">
<media-text class="pl-play-play" token="buttons.play">Play</media-text>
<media-text class="pl-play-pause" token="buttons.pause">Pause</media-text>
<media-text class="pl-play-restart" token="buttons.replay">Replay</media-text>
</span>
</media-play-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<media-seek-button seconds="-10" class="pl-btn pl-btn-seek">
<span class="pl-btn-text" aria-hidden="true"><bdi dir="ltr">&minus;10</bdi></span>
</media-seek-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<media-seek-button seconds="10" class="pl-btn pl-btn-seek">
<span class="pl-btn-text" aria-hidden="true"><bdi dir="ltr">+10</bdi></span>
</media-seek-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<span class="pl-sep" aria-hidden="true"></span>
<div class="pl-volume">
<media-mute-button class="pl-btn pl-btn-mute">
<span class="pl-btn-glyph pl-only-narrow" aria-hidden="true">
<media-icon family="pl" name="volume" class="pl-icon pl-mute-on"></media-icon>
<media-icon family="pl" name="muted" class="pl-icon pl-mute-off"></media-icon>
</span>
<span class="pl-btn-text" aria-hidden="true">
<media-text class="pl-mute-on" token="buttons.mute">Mute</media-text>
<media-text class="pl-mute-off" token="buttons.unmute">Unmute</media-text>
</span>
</media-mute-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<media-volume-slider class="pl-volume-slider">
<media-slider-track class="pl-volume-track">
<media-slider-fill class="pl-volume-fill">
</media-slider-fill>
</media-slider-track>
<media-slider-thumb class="pl-volume-thumb">
</media-slider-thumb>
</media-volume-slider>
</div>
<span class="pl-sep" aria-hidden="true"></span>
<!-- Quality: the stream's renditions, from Video.js. The menu binds to the key right before it,
     and hides the key when the stream has one rendition or none. -->
<button type="button" class="pl-btn pl-btn-quality">
<span class="pl-btn-glyph pl-quality-glyph" aria-hidden="true"><media-icon family="pl" name="quality" class="pl-icon"></media-icon></span>
<span class="pl-btn-text"><span><media-text token="menu.quality">Quality</media-text> <span class="pl-quality-value" data-part="value"></span></span></span>
</button>
<media-menu side="top" align="end" class="pl-menu pl-quality-menu">
<media-menu-content class="pl-menu-content">
<media-quality-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
<span class="pl-menu-tier" data-part="tier"></span>
<span class="pl-menu-tier" data-part="badge"></span>
</media-menu-radio-item>
</template>
</media-quality-radio-group>
</media-menu-content>
</media-menu>
<!-- Speed: a menu of rates from Video.js, bound to the key right before it. The key shows the rate. -->
<button type="button" class="pl-btn pl-btn-rate">
<span class="pl-btn-text"><span><media-text token="menu.speed">Speed</media-text> <span class="pl-btn-value" data-part="value"></span></span></span>
</button>
<media-menu side="top" align="end" class="pl-menu pl-rate-menu">
<media-menu-content class="pl-menu-content">
<media-playback-rate-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-playback-rate-radio-group>
</media-menu-content>
</media-menu>
<!-- Captions and Audio: menus of the media's tracks, hidden by Video.js when there are none to choose. -->
<button type="button" class="pl-btn pl-btn-captions">
<span class="pl-btn-glyph pl-captions-glyph" aria-hidden="true"><media-icon family="pl" name="cc" class="pl-icon"></media-icon></span>
<span class="pl-btn-text"><span><media-text class="pl-captions-word" token="menu.captions">Captions</media-text> <span class="pl-btn-value" data-part="value"></span></span></span>
</button>
<media-menu side="top" align="end" class="pl-menu pl-btn-captions-menu">
<media-menu-content class="pl-menu-content">
<media-captions-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-captions-radio-group>
</media-menu-content>
</media-menu>
<button type="button" class="pl-btn pl-btn-audio">
<span class="pl-btn-text"><span><media-text token="menu.audio">Audio</media-text> <span class="pl-btn-value" data-part="value"></span></span></span>
</button>
<media-menu side="top" align="end" class="pl-menu pl-btn-audio-menu">
<media-menu-content class="pl-menu-content">
<media-audio-track-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-audio-track-radio-group>
</media-menu-content>
</media-menu>
<!-- Index: opens the chapter index as a panel in fullscreen (chapters.ts). -->
<button type="button" class="pl-btn pl-btn-index" aria-expanded="false"><media-text token="pl.index">Index</media-text></button>
<media-airplay-button class="pl-btn pl-btn-glyph-key pl-btn-airplay">
<span class="pl-btn-glyph" aria-hidden="true"><media-icon family="pl" name="airplay" class="pl-icon"></media-icon></span>
</media-airplay-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<media-cast-button class="pl-btn pl-btn-glyph-key pl-btn-cast">
<span class="pl-btn-glyph" aria-hidden="true"><media-icon family="pl" name="cast" class="pl-icon"></media-icon></span>
</media-cast-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<media-pip-button class="pl-btn pl-btn-pip">
<span class="pl-btn-glyph" aria-hidden="true"><media-icon family="pl" name="pip" class="pl-icon"></media-icon></span>
</media-pip-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<media-fullscreen-button class="pl-btn pl-btn-full">
<span class="pl-btn-glyph pl-only-narrow" aria-hidden="true">
<media-icon family="pl" name="expand" class="pl-icon pl-full-enter"></media-icon>
<media-icon family="pl" name="collapse" class="pl-icon pl-full-exit"></media-icon>
</span>
<span class="pl-btn-text" aria-hidden="true"><media-text class="pl-full-enter" token="status.fullscreen">Fullscreen</media-text><media-text class="pl-full-exit" token="pl.exit">Exit</media-text></span>
</media-fullscreen-button>
<media-tooltip side="top" class="pl-tooltip"><media-tooltip-label></media-tooltip-label><media-tooltip-shortcut class="pl-tooltip-key"></media-tooltip-shortcut></media-tooltip>
<!-- More: a Video.js menu with a page per setting. pl-overflow links each item to its page
     with ids of its own, so two players on a page never share them. -->
<pl-overflow class="pl-overflow">
<button type="button" class="pl-btn pl-btn-more pl-only-narrow">
<span class="pl-btn-glyph" aria-hidden="true"><media-icon family="pl" name="more" class="pl-icon"></media-icon></span>
<media-text class="pl-visually-hidden pl-more-label" token="pl.more">More</media-text>
</button>
<media-menu side="top" align="end" class="pl-menu pl-more">
<media-menu-content class="pl-menu-content">
<media-menu-item class="pl-menu-item pl-menu-page" data-page="speed">
<media-text token="menu.speed">Speed</media-text>
<span class="pl-menu-hint"><span class="pl-btn-value" data-part="value"></span><span class="pl-menu-chevron" aria-hidden="true">&rsaquo;</span></span>
</media-menu-item>
<media-menu-content class="pl-menu-content" data-page-for="speed">
<media-menu-item class="pl-menu-item pl-menu-back"><span class="pl-menu-chevron" aria-hidden="true">&lsaquo;</span> <media-text token="menu.speed">Speed</media-text></media-menu-item>
<media-playback-rate-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-playback-rate-radio-group>
</media-menu-content>
<media-menu-item class="pl-menu-item pl-menu-page" data-page="quality">
<media-text token="menu.quality">Quality</media-text>
<span class="pl-menu-hint"><span class="pl-btn-value" data-part="value"></span><span class="pl-menu-chevron" aria-hidden="true">&rsaquo;</span></span>
</media-menu-item>
<media-menu-content class="pl-menu-content" data-page-for="quality">
<media-menu-item class="pl-menu-item pl-menu-back"><span class="pl-menu-chevron" aria-hidden="true">&lsaquo;</span> <media-text token="menu.quality">Quality</media-text></media-menu-item>
<media-quality-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
<span class="pl-menu-tier" data-part="badge"></span>
</media-menu-radio-item>
</template>
</media-quality-radio-group>
</media-menu-content>
<media-menu-item class="pl-menu-item pl-menu-page" data-page="captions">
<media-text token="menu.captions">Captions</media-text>
<span class="pl-menu-hint"><span class="pl-btn-value" data-part="value"></span><span class="pl-menu-chevron" aria-hidden="true">&rsaquo;</span></span>
</media-menu-item>
<media-menu-content class="pl-menu-content" data-page-for="captions">
<media-menu-item class="pl-menu-item pl-menu-back"><span class="pl-menu-chevron" aria-hidden="true">&lsaquo;</span> <media-text token="menu.captions">Captions</media-text></media-menu-item>
<media-captions-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-captions-radio-group>
</media-menu-content>
<media-menu-item class="pl-menu-item pl-menu-page" data-page="audio">
<media-text token="menu.audio">Audio</media-text>
<span class="pl-menu-hint"><span class="pl-btn-value" data-part="value"></span><span class="pl-menu-chevron" aria-hidden="true">&rsaquo;</span></span>
</media-menu-item>
<media-menu-content class="pl-menu-content" data-page-for="audio">
<media-menu-item class="pl-menu-item pl-menu-back"><span class="pl-menu-chevron" aria-hidden="true">&lsaquo;</span> <media-text token="menu.audio">Audio</media-text></media-menu-item>
<media-audio-track-radio-group class="pl-menu-group">
<template>
<media-menu-radio-item class="pl-menu-item">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-audio-track-radio-group>
</media-menu-content>
</media-menu-content>
</media-menu>
</pl-overflow>
</media-tooltip-group>
</div>
</div>
<media-error-dialog>
<media-dialog-backdrop class="pl-dialog-backdrop">
</media-dialog-backdrop>
<media-dialog-popup class="pl-dialog">
<media-text class="pl-label pl-dialog-code" token="pl.error" aria-hidden="true">Error</media-text>
<media-dialog-title class="pl-dialog-title">
</media-dialog-title>
<media-text class="pl-dialog-hint" token="pl.errorHint">The video didn't load. Check your connection and try again.</media-text>
<!-- The technical reason from the media, for whoever needs to report it. -->
<media-dialog-description class="pl-dialog-description">
</media-dialog-description>
<media-dialog-close class="pl-btn pl-dialog-close" autofocus>
</media-dialog-close>
</media-dialog-popup>
</media-error-dialog>

<media-hotkey keys="k" action="togglePaused">
</media-hotkey>
<media-hotkey keys="m" action="toggleMuted">
</media-hotkey>
<media-hotkey keys="ArrowRight" action="seekStep">
</media-hotkey>
<media-hotkey keys="ArrowLeft" action="seekStep">
</media-hotkey>
<media-hotkey keys="l" action="seekStep">
</media-hotkey>
<media-hotkey keys="j" action="seekStep">
</media-hotkey>
<media-hotkey keys="ArrowUp" action="volumeStep">
</media-hotkey>
<media-hotkey keys="ArrowDown" action="volumeStep">
</media-hotkey>
<media-hotkey keys="0-9" action="seekToPercent">
</media-hotkey>
<media-hotkey keys="Home" action="seekToPercent" value="0">
</media-hotkey>
<media-hotkey keys="End" action="seekToPercent" value="100">

</media-hotkey>
<media-hotkey keys="i" action="togglePictureInPicture">

<media-gesture type="tap" action="togglePaused" pointer="mouse" region="center">
